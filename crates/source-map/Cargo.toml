[package]
name = "textprep-source-map"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "Byte provenance for rendered, normalized, or extracted UTF-8 text"
repository = "https://github.com/arclabs561/textprep"
keywords = ["provenance", "source-map", "unicode", "text-processing"]
categories = ["text-processing", "data-structures"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
hmac-sha256 = { version = "1.1.14", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
